name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore GitHubDigest/GitHubDigest.csproj

      - name: Pack
        run: dotnet pack GitHubDigest/GitHubDigest.csproj --configuration Release --no-restore

      - name: Publish to NuGet
        run: dotnet nuget push GitHubDigest/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
